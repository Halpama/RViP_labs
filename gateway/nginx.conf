events {}

http {
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream reader_service {
        zone reader_service 64k;
        server reader-service:3001 resolve;
    }
    upstream report_service { server report-service:3002; }
    upstream file_storage_service { server file-storage-service:3003; }

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    server {
        listen 80;
        proxy_intercept_errors on;
        error_page 502 = @bad_gateway;
        error_page 504 = @upstream_timeout;

        location = /reader-service { return 301 /reader-service/; }
        location /reader-service/ {
            proxy_pass http://reader_service/;
        }
        location = /report-service { return 301 /report-service/; }
        location /report-service/ {
            proxy_pass http://report_service/;
        }
        location = /file-storage { return 301 /file-storage/; }
        location /file-storage/ {
            proxy_pass http://file_storage_service/;
        }

        location @bad_gateway {
            default_type application/json;
            return 502 '{"error":"upstream service unavailable"}';
        }
        location @upstream_timeout {
            default_type application/json;
            return 504 '{"error":"upstream service timed out"}';
        }
    }
}
