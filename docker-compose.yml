services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-library}
      POSTGRES_USER: ${POSTGRES_USER:-library}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-library}
    ports:
      - "127.0.0.1:55432:5432"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: library
      RABBITMQ_DEFAULT_PASS: library
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  migrate:
    build:
      context: ./apps/reader-service
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-library}:${POSTGRES_PASSWORD:-library}@postgres:5432/${POSTGRES_DB:-library}
    entrypoint: []
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  reader-service:
    build:
      context: ./apps/reader-service
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-library}:${POSTGRES_PASSWORD:-library}@postgres:5432/${POSTGRES_DB:-library}
      APP_PORT: 3001
      INSTANCE_NAME: ${READER_INSTANCE_NAME:-reader-service}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:3001/readers')\""]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - internal

  report-service:
    build:
      context: ./apps/report-service
    environment:
      READER_SERVICE_URL: http://reader-service:3001
      RABBITMQ_URL: amqp://library:library@rabbitmq:5672/
      APP_PORT: 3002
      INSTANCE_NAME: ${REPORT_INSTANCE_NAME:-report-service}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:3002/docs')\""]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      reader-service:
        condition: service_healthy
      file-storage-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - internal

  file-storage-service:
    build:
      context: ./apps/file-storage-service
    environment:
      RABBITMQ_URL: amqp://library:library@rabbitmq:5672/
      APP_PORT: 3003
    volumes:
      - file_storage:/storage
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:3003/health')\""]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - internal

  loki:
    image: grafana/loki:3.5.5
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - internal

  promtail:
    image: grafana/promtail:3.5.5
    command: ["-config.file=/etc/promtail/promtail-config.yaml"]
    volumes:
      - ./observability/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    deploy:
      resources:
        limits:
          memory: 128M
    depends_on:
      - loki
    networks:
      - internal

  grafana:
    image: grafana/grafana:12.1.1
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    deploy:
      resources:
        limits:
          memory: 256M
    depends_on:
      - loki
    networks:
      - public
      - internal

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      reader-service:
        condition: service_healthy
      report-service:
        condition: service_healthy
      file-storage-service:
        condition: service_healthy
    networks:
      - public
      - internal

networks:
  public:
  internal:

volumes:
  file_storage:
  loki-data:
  grafana-data:
  rabbitmq-data: